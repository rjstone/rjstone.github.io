name: "Test site: deploy to test.rjstone.net"

# The test site is a separate Pages site in rjstone/rjstone-test; its deploy
# workflow checks out this commit, builds it, and publishes it. The build
# sanity check for this commit is the run-checks job in ci.yaml.
on:
  push:
    branches: [ test ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.TEST_SITE_TOKEN }}
    steps:
      - name: Start the deploy workflow in rjstone/rjstone-test
        if: env.GH_TOKEN != ''
        run: gh workflow run deploy.yml --repo rjstone/rjstone-test -f ref=${{ github.sha }}

      - name: Explain skipped deploy
        if: env.GH_TOKEN == ''
        run: echo "::notice::TEST_SITE_TOKEN secret is not set; skipping the test site deploy."
