name: Run checks

on:
  push:
  workflow_dispatch:

# Lint/check/build only needs to read the repository
permissions:
  contents: read

jobs:
  run-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Run checks
        run: pnpm check

      # Build sanity check (no deploy); this job is a required status check on main
      - name: Build
        run: pnpm build
